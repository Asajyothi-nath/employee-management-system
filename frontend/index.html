<!doctype html>
<html lang="en">
  <head>
    <script>
      // Force browser to send requests to your live Render backend instead of localhost
      const _origFetch = window.fetch;
      window.fetch = function(url, options) {
        if (typeof url === 'string' && url.includes('http://localhost:8000/api')) {
          url = url.replace('http://localhost:8000/api', 'https://onrender.com');
        }
        return _origFetch(url, options);
      };

      const _origOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url, ...args) {
        if (typeof url === 'string' && url.includes('http://localhost:8000/api')) {
          url = url.replace('http://localhost:8000/api', 'https://onrender.com');
        }
        return _origOpen.apply(this, [method, url, ...args]);
      };
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
