name: AWS EC2 Deployment Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Find and Install Dependencies
      run: |
        # Search for where package.json is hiding in your repository
        TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
        
        if [ -z "$TARGET_DIR" ] || [ "$TARGET_DIR" = "." ]; then
          echo "Running install in root directory..."
          npm install
        else
          echo "Found package.json in subfolder: $TARGET_DIR. Moving inside..."
          cd "$TARGET_DIR"
          npm install
        fi

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - name: SSH into EC2 and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Locate the project folder dynamically on AWS
          PROJECT_DIR=$(find /home/${{ secrets.EC2_USER }} -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: Could not find your Node project directory on AWS."
            exit 1
          fi
          
          cd "$PROJECT_DIR"
          echo "Successfully entered directory: $PROJECT_DIR"
          
          # 2. Sync and pull fresh changes
          git reset --hard
          git pull origin main
          
          # 3. Install packages directly inside that folder
          npm install --production
          
          # 4. Safely restart your active process
          pm2 restart all || (npm run build --if-present && npm start &)
