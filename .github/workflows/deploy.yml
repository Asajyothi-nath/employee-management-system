name: Node + React CI/CD Pipeline

on:
  push:
    branches: [ main ] # This triggers the pipeline on push

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install & Build React Frontend
      run: |
        cd frontend
        npm install
        npm run build

    - name: Install Node Backend
      run: |
        cd backend
        npm install

    # This step logs into your EC2 to update the code
    
