name: Node + React CI/CD Pipeline

on:
  push:
    branches: [ main ] # This triggers the pipeline on push

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install & Build React Frontend
      run: |
        cd frontend
        npm install
        npm run build

    - name: Install Node Backend
      run: |
        cd backend
        npm install

    # This step logs into your EC2 to update the code
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /var/www/my-app 
          git pull origin main
          cd backend
          npm install --production
          pm2 restart all || pm2 start server.js --name "node-backend"
